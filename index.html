<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locust · Penn degree planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#faf8f4; --ink:#141b2d; --muted:#667085; --faint:#98a2b3;
  --line:#e7e2d8; --line2:#d9d2c4;
  --navy:#011F5B; --red:#990000; --accent:#990000; --accent-ink:#fff; --accent-soft:#f6e6e6;
  --green:#2f7a4c; --green-soft:#e5f2ea; --sienna:#b4532a; --sienna-soft:#f8e8df; --blue-soft:#e6ecf7;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --radius:12px;
  --serif:"Newsreader",Georgia,serif; --sans:"Inter",system-ui,-apple-system,Segoe UI,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1020; --surface:#121a2c; --surface2:#0f1626; --ink:#e7eaf3; --muted:#9aa4b8; --faint:#6b768c;
    --line:#212c44; --line2:#2c3956;
    --navy:#9db7ff; --accent:#e5747a; --accent-ink:#1a0b0d; --accent-soft:#3a1d22;
    --green:#6cc492; --green-soft:#16302a; --sienna:#ee9a72; --sienna-soft:#3a2418; --blue-soft:#1a2440;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand svg{flex:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--surface)}
nav.tabs a.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.sync{font-size:12px;color:var(--faint);white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 12px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600}
.sub{color:var(--muted);margin:0 0 22px;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.g{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.r{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.s{background:var(--sienna-soft);color:var(--sienna);border-color:transparent}
.pill.b{background:var(--blue-soft);color:var(--navy);border-color:transparent}
input[type=text],input[type=search],input[type=number],select{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,.btn:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:1px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.bar{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.g>i{background:var(--green)}
.big{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
/* checklist */
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;margin-top:1px}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.dot.part{border-color:var(--green)}
/* course list */
.filters{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.filters{grid-template-columns:1fr}}
.side{position:sticky;top:74px}
@media(max-width:900px){.side{position:static}}
.side label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.side select,.side input{width:100%}
.course{padding:16px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.course:first-child{border-top:0}
.course .code{font-weight:700;font-family:var(--mono);font-size:13.5px}
.course .title{font-weight:600;font-size:15px;cursor:pointer}
.course .title:hover{text-decoration:underline}
.course .desc{color:var(--muted);font-size:13.5px;grid-column:1/-1;max-width:95ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.course .acts{display:flex;gap:6px;align-items:flex-start}
.stats{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink);font-weight:600}
.star{background:none;border:0;cursor:pointer;font-size:18px;color:var(--faint);padding:2px 6px;line-height:1}
.star.on{color:#d4a017}
.pager{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:12px 4px;color:var(--muted)}
/* planner */
.year{margin-bottom:22px}
.yearhead{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.yearhead h2{margin:0;font-size:19px}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dense .terms{grid-template-columns:1fr 1fr 0.8fr}
@media(max-width:900px){.terms{grid-template-columns:1fr}}
.term{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-height:130px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.term.past{border-style:dashed;background:var(--surface2)}
.term.drop{outline:2px dashed var(--accent);outline-offset:2px}
.termhead{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.termhead .cu{font-size:12px;color:var(--muted);font-weight:500}
.termhead .cu.over{color:var(--sienna);font-weight:600}
.chips{display:flex;flex-direction:column;gap:6px;flex:1}
.chip{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);cursor:grab;user-select:none;font-size:13px;position:relative}
.chip:active{cursor:grabbing}
.chip .cc{font-family:var(--mono);font-weight:600;font-size:12.5px;white-space:nowrap}
.chip .ct{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chip .cu{font-size:11.5px;color:var(--faint);white-space:nowrap}
.chip.creq{border-color:color-mix(in srgb,var(--green) 55%,transparent);background:var(--green-soft)}
.chip.creq .cc{color:var(--green)}
.chip.warn{border-color:color-mix(in srgb,var(--sienna) 60%,transparent);background:var(--sienna-soft)}
.chip.warn .cc{color:var(--sienna)}
.chip.ext{border-style:dotted}
.chip .x2{font-size:10.5px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:4px;padding:0 4px}
.chip.dragging{opacity:.4}
.addline{display:flex;gap:6px}
.addline input{flex:1;font-size:13px;padding:5px 8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line2);vertical-align:-3px;margin-right:5px}
.sw.g{background:var(--green-soft);border-color:var(--green)}.sw.s{background:var(--sienna-soft);border-color:var(--sienna)}.sw.d{border-style:dashed}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:10px;border:1px dashed var(--line2);border-radius:10px;background:var(--surface2)}
.tray .chip{width:auto}
/* suggest dropdown */
.sugg{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:320px;overflow:auto;width:min(420px,90vw)}
.sugg div{padding:8px 10px;cursor:pointer;display:flex;gap:8px;border-top:1px solid var(--line)}
.sugg div:first-child{border-top:0}
.sugg div.hl,.sugg div:hover{background:var(--surface2)}
/* menus / modal */
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:6px;min-width:220px;max-width:320px;max-height:70vh;overflow:auto}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--surface2)}
.menu .sep{height:1px;background:var(--line);margin:5px 0}
.menu .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:6px 10px 2px}
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:24px;border:1px solid var(--line)}
.modal h2{margin-bottom:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
/* requirements */
.req{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.req:first-child{border-top:0}
.req .nm{font-weight:500}
.req .fill{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.req .cnt{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
.group+.group{margin-top:16px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}
/* schedule */
.sched{display:grid;grid-template-columns:52px repeat(5,1fr);position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.sched .hd{padding:8px;text-align:center;font-weight:600;border-bottom:1px solid var(--line);background:var(--surface2);font-size:13px}
.sched .col{position:relative;border-left:1px solid var(--line)}
.sched .hr{height:48px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);padding:2px 6px;box-sizing:border-box}
.blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:4px 6px;font-size:11.5px;overflow:hidden;background:var(--blue-soft);border-left:3px solid var(--navy);color:var(--ink)}
.blk.conf{background:var(--sienna-soft);border-left-color:var(--sienna)}
.blk b{font-family:var(--mono);font-size:11px}
/* credit table */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:9px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-top:0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 9px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:80;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty{color:var(--faint);font-size:13px;padding:6px 2px}
.toggle{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle input{margin-top:3px}
@media(max-width:700px){.topin{flex-wrap:wrap;gap:6px 12px;padding:8px 14px}.sync{display:none}nav.tabs{order:3;flex-basis:100%}main{padding:18px 14px 60px}h1{font-size:28px}}
footer{max-width:1240px;margin:0 auto;padding:0 20px 40px;color:var(--faint);font-size:12px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
.planlist{font-size:13.5px}
.planlist .t{font-weight:600;margin-top:12px}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <a class="brand" href="#home" aria-label="Locust home">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7" fill="#011F5B"/><path d="M8 7v12h10" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17.5" cy="9" r="2.4" fill="#990000"/></svg>
    Locust
  </a>
  <nav class="tabs" id="tabs"></nav>
  <span class="sync" id="sync"></span>
</div></header>
<main id="app"><div class="loading">Loading the Penn catalog…</div></main>
<footer>Unofficial student tool — not affiliated with or endorsed by the University of Pennsylvania. Course data from Penn Courses (Fall 2025–Spring 2027); requirements from the 2026-27 Penn Catalog. Always confirm with your advisor and Path@Penn.</footer>
<script src="programs.js"></script>
<script src="app.js"></script>
</body>
</html>
